<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6efe2" />
    <script>
      // Tema guardado y momento del día antes de pintar, para que no parpadee.
      try {
        const tema = localStorage.getItem("tema");
        if (tema === "claro" || tema === "oscuro") document.documentElement.dataset.tema = tema;
      } catch {}
      try {
        const h = Number(new Intl.DateTimeFormat("en-US", { timeZone: "America/Argentina/Buenos_Aires", hour: "2-digit", hourCycle: "h23" }).format(new Date()));
        document.documentElement.dataset.franja = h >= 5 && h < 12 ? "manana" : h >= 12 && h < 20 ? "tarde" : "noche";
      } catch {}
    </script>
    <title>Carta · Café Almendra</title>
    <meta name="description" content="La carta del salón de Café Almendra: café de especialidad, medialunas, tostados, tortas y desayunos." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Café Almendra" />
    <meta property="og:url" content="https://cafe-almendra.vercel.app/carta" />
    <meta property="og:title" content="Carta · Café Almendra" />
    <meta property="og:description" content="La carta del salón de Café Almendra: café de especialidad, medialunas, tostados, tortas y desayunos." />
    <meta property="og:image" content="https://cafe-almendra.vercel.app/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Café Almendra: una taza de café con corazón, un croissant de almendras y una rama de almendro en flor." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/locales/cafe-almendra/marca.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Vercel Web Analytics: cuenta las visitas (sin cookies); el script se inserta desde acá para que Vite no intente empaquetarlo. Se activa en el panel de Vercel → Analytics. -->
    <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
    <script>(function () { var s = document.createElement("script"); s.defer = true; s.src = "/_vercel/insights/script.js"; document.head.appendChild(s); })();</script>
  </head>
  <body>
    <div id="aviso-dia" class="aviso-dia" role="status" hidden></div>

    <header class="tapa">
      <div class="tapa-barra">
        <img class="tapa-isotipo" data-logo="isotipo" data-alt="" width="40" height="40" alt="" hidden />
        <p class="estado" data-estado hidden></p>
        <button id="boton-tema" class="boton-tema" type="button" aria-pressed="false" aria-label="Cambiar a modo oscuro">
          <svg class="icono-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
          </svg>
          <svg class="icono-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </button>
      </div>
      <div class="tapa-portada">
        <div class="tapa-rama" aria-hidden="true" data-rama></div>
        <p class="tapa-volanta mano">Carta del salón</p>
        <h1 class="tapa-nombre"><span id="nombre-a">Café</span> <em id="nombre-b">Almendra</em></h1>
        <p class="tapa-sub" id="tapa-sub">Café de especialidad · desde 2016</p>
      </div>
      <p class="mozo">Elegí tranquilo y <strong>pedile al mozo</strong>.</p>
    </header>

    <nav class="pestanas-caja" aria-label="Categorías">
      <div id="pestanas" class="pestanas"></div>
    </nav>

    <main id="carta" class="carta"></main>

    <aside class="a-casa" aria-labelledby="a-casa-titulo">
      <div class="a-casa-dibujo" aria-hidden="true" id="a-casa-dibujo"></div>
      <div>
        <p class="mano a-casa-volanta">¿Para llevar?</p>
        <h2 id="a-casa-titulo">Pedí desde <em>la web</em></h2>
        <p id="a-casa-texto">Armá tu pedido y mandalo por WhatsApp: retirás acá o te lo llevamos.</p>
        <a id="enlace-web" class="boton boton-marca" href="/">Ir a la web de pedidos</a>
      </div>
    </aside>

    <footer class="pie">
      <div class="pie-rama" aria-hidden="true" data-ramita></div>
      <p class="pie-nombre" id="pie-nombre">Café Almendra</p>
      <p class="pie-dato" id="pie-dato"></p>
      <ul id="pie-horarios" class="pie-horarios" aria-label="Horarios"></ul>
      <p id="demo" class="demo" hidden>Local de demostración: los datos son ficticios.</p>
    </footer>

    <script type="module" src="/src/carta/main.ts"></script>
  </body>
</html>
